# Deploys site/ (minus tools/ and README.md) to GitHub Pages, including the installer at
# /install and /install.sh. Pages is configured with build_type "workflow".
# Custom domain (once DNS points at GitHub Pages): set it in the repository's Pages settings,
#   gh api -X PUT repos/selfdrivingjazz/vamp.sh/pages -f cname=vamp.sh
# (with a workflow deployment the domain lives in the settings; no CNAME file is needed).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site
        run: |
          cp -RL site _site
          rm -rf _site/tools _site/README.md
          sh -n _site/install
          cmp _site/install _site/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
