<script src="/bat-mask.js"></script>

<script>
  (document.fonts ? document.fonts.load('500 11px "Geist Mono"') : Promise.resolve()).then(function () {
    new VampField.Field(document.getElementById('field'), {
      reduced: true, epoch: 0,
      layout: function (w, h) { return w < 600 ? { cx: w * 0.5, cy: h * 0.36, r: w * 0.32 } : { cx: w * 0.72, cy: h * 0.45, r: Math.min(w * 0.2, h * 0.3) }; }
    });
  });
</script>
