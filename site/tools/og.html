<!doctype html>
<!-- Open Graph card source. `node tools/build.mjs --og` screenshots this at 1200x630 into ../og.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; isolation: isolate; width: 1200px; height: 630px; padding: 56px 64px; display: grid; grid-template-rows: auto 1fr auto; }
  .og .field { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .og .brand { font-size: 30px; }
  .og .brand span { font-size: 33px; }
  .og h1 { align-self: end; max-width: 10.5em; font: 800 76px/0.96 var(--display); font-stretch: 112%; letter-spacing: -0.025em; padding-bottom: 28px; text-shadow: 0 0 24px var(--ground), 0 0 4px var(--ground); }
  .og .cap { font-size: 22px; border-top: 1px solid var(--aub-2); padding-top: 18px; }
</style>
</head>
<body>
<div class="og">
  <canvas class="field" id="field"></canvas>
  <p class="brand">VAMP<span>.sh</span></p>
  <h1>A visual media protocol for humans and <span class="px">agents</span>.</h1>
  <p class="cap">vamp.sh <i>/</i> open protocol <i>/</i> MIT</p>
</div>
<script src="../bat-mask.js"></script>
<script src="../field.js"></script>
<script>
  document.fonts.load('500 11px "Geist Mono"').then(function () {
    new VampField.Field(document.getElementById('field'), {
      reduced: true, epoch: 0,
      layout: function (w, h) { return { cx: w * 0.76, cy: h * 0.46, r: h * 0.36 }; }
    });
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
